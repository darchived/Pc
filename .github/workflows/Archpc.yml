name: Secure Tailscale Cloud RDP

on: 
  workflow_dispatch:

jobs:
  run-environment:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
    - name: Deploy Secure Windows Mesh Network
      env:
        TS_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
      run: |
        # 1. Install Tailscale
        choco install tailscale --no-progress -y
        
        # 2. Reload Environment Paths
        $env:Path = [System.Environment]::GetEnvironmentVariable("Path","Machine") + ";" + [System.Environment]::GetEnvironmentVariable("Path","User")
        
        # 3. Start Tailscale service
        Start-Service tailscale
        
        # 4. Connect to your private Tailscale network
        tailscale up --authkey="$env:TS_KEY" --accept-routes --unattended
        
        # 5. Enable Remote Desktop
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
        Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 1
        
        # 6. Enable Administrator account and set your custom password
        net user Administrator /active:yes
        net user Administrator "Adminroot1!"
        
        Write-Host "=========================================================="
        Write-Host "LOGIN USERNAME: Administrator"
        Write-Host "LOGIN PASSWORD: Adminroot1!"
        Write-Host "=========================================================="
        
        # Keep the machine alive for 6 hours
        while ($true) { Start-Sleep -Seconds 60 }
      shell: powershell
