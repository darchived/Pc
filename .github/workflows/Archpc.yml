name: Secure Tailscale Cloud RDP

on: 
  workflow_dispatch:

jobs:
  run-environment:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
    - name: Deploy Secure Windows Mesh Network
      env:
        TS_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
      run: |
        # 1. Install Tailscale
        choco install tailscale --no-progress -y
        
        # 2. Reload Environment Paths
        $env:Path = [System.Environment]::GetEnvironmentVariable("Path","Machine") + ";" + [System.Environment]::GetEnvironmentVariable("Path","User")
        
        # 3. Start Tailscale service
        Start-Service tailscale
        
        # 4. Connect to your private Tailscale network
        tailscale up --authkey="$env:TS_KEY" --accept-routes --unattended
        
        # 5. Enable Remote Desktop and disable strict network level blocking
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
        Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0
        
        # 6. Create a brand new unlocked Admin account with your exact password
        $Password = ConvertTo-SecureString "BashRoot!" -AsPlainText -Force
        New-LocalUser -Name "AdminUser" -Password $Password -FullName "AdminUser" -AccountNeverExpires
        Add-LocalGroupMember -Group "Administrators" -Member "AdminUser"
        Add-LocalGroupMember -Group "Remote Desktop Users" -Member "AdminUser"
        
        Write-Host "=========================================================="
        Write-Host "LOGIN USERNAME: AdminUser"
        Write-Host "LOGIN PASSWORD: BashRoot!"
        Write-Host "=========================================================="
        
        # Keep the machine alive for 6 hours
        while ($true) { Start-Sleep -Seconds 60 }
      shell: powershell
